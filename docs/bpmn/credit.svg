<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1675" role="img" aria-label="To-Be: Credit Monitoring and Collection"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52657a"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="35" y="35" font-size="21" font-family="Arial" font-weight="bold">To-Be: Credit Monitoring and Collection</text><rect x="70" y="60" width="320" height="1590" fill="#fafcfd" stroke="#c1ccd8"/><text x="230" y="85" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">Staff / Admin</text><rect x="390" y="60" width="320" height="1590" fill="#f1f6fa" stroke="#c1ccd8"/><text x="550" y="85" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">Management System</text><rect x="710" y="60" width="320" height="1590" fill="#fafcfd" stroke="#c1ccd8"/><text x="870" y="85" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold">Admin</text><polyline points="545,138 545,176.5 545,176.5 545,215" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="545,287 545,308.5 545,308.5 545,330" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="545,386 545,415.5 545,415.5 545,445" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="551" y="409.5" font-family="Arial" font-size="11" fill="#34475e" stroke="white" stroke-width="4" paint-order="stroke">No</text><polyline points="573,358 685,358 685,596 660,596" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="691" y="352" font-family="Arial" font-size="11" fill="#34475e" stroke="white" stroke-width="4" paint-order="stroke">Yes</text><polyline points="545,632 545,653.5 225,653.5 225,675" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="225,747 225,768.5 545,768.5 545,790" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="545,862 545,883.5 545,883.5 545,905" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="545,961 545,990.5 225,990.5 225,1020" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="551" y="984.5" font-family="Arial" font-size="11" fill="#34475e" stroke="white" stroke-width="4" paint-order="stroke">No</text><polyline points="110,1056 85,1056 85,711 110,711" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="573,933 685,933 685,1171 660,1171" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="691" y="927" font-family="Arial" font-size="11" fill="#34475e" stroke="white" stroke-width="4" paint-order="stroke">Yes</text><polyline points="545,1207 545,1228.5 545,1228.5 545,1250" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="517,1278 405,1278 405,711 110,711" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="411" y="1272" font-family="Arial" font-size="11" fill="#34475e" stroke="white" stroke-width="4" paint-order="stroke">No: later payment</text><polyline points="545,1306 545,1335.5 865,1335.5 865,1365" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="551" y="1329.5" font-family="Arial" font-size="11" fill="#34475e" stroke="white" stroke-width="4" paint-order="stroke">Yes</text><polyline points="865,1437 865,1458.5 865,1458.5 865,1480" fill="none" stroke="#52657a" stroke-width="1.5" marker-end="url(#arrow)"/><circle cx="545" cy="119" r="18" fill="white" stroke="#183e51" stroke-width="1.5"/><text x="545" y="155" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Hourly credit monitoring</text><rect x="430" y="215" width="230" height="72" rx="10" fill="#deeffb" stroke="#477080"/><text x="439" y="230" font-size="9" font-family="Arial" fill="#4a626f">SYSTEM</text><text x="545" y="247" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Find unpaid credit reaching</text><text x="545" y="261" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">14-day term</text><path d="M545,330 l28,28 -28,28 -28,-28 Z" fill="#fff4ce" stroke="#987631"/><text x="545" y="364" text-anchor="middle" font-family="Arial" font-size="22">×</text><text x="545" y="403" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Overdue found?</text><circle cx="545" cy="464" r="18" fill="white" stroke="#183e51" stroke-width="4"/><text x="545" y="500" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Monitoring complete</text><rect x="430" y="560" width="230" height="72" rx="10" fill="#deeffb" stroke="#477080"/><text x="439" y="575" font-size="9" font-family="Arial" fill="#4a626f">SYSTEM</text><text x="545" y="592" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Suspend credit; notify</text><text x="545" y="606" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">customer, admin and staff</text><rect x="110" y="675" width="230" height="72" rx="10" fill="#e6f3ed" stroke="#477080"/><text x="119" y="690" font-size="9" font-family="Arial" fill="#4a626f">USER</text><text x="225" y="707" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Receive customer payment and</text><text x="225" y="721" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">enter collection</text><rect x="430" y="790" width="230" height="72" rx="10" fill="#deeffb" stroke="#477080"/><text x="439" y="805" font-size="9" font-family="Arial" fill="#4a626f">SYSTEM</text><text x="545" y="822" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Validate payment against</text><text x="545" y="836" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">outstanding balance</text><path d="M545,905 l28,28 -28,28 -28,-28 Z" fill="#fff4ce" stroke="#987631"/><text x="545" y="939" text-anchor="middle" font-family="Arial" font-size="22">×</text><text x="545" y="978" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Valid amount?</text><rect x="110" y="1020" width="230" height="72" rx="10" fill="#e6f3ed" stroke="#477080"/><text x="119" y="1035" font-size="9" font-family="Arial" fill="#4a626f">USER</text><text x="225" y="1052" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Correct payment amount</text><rect x="430" y="1135" width="230" height="72" rx="10" fill="#deeffb" stroke="#477080"/><text x="439" y="1150" font-size="9" font-family="Arial" fill="#4a626f">SYSTEM</text><text x="545" y="1167" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Save payment, reduce balance</text><text x="545" y="1181" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">and allocate to oldest due</text><text x="545" y="1195" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">credits</text><path d="M545,1250 l28,28 -28,28 -28,-28 Z" fill="#fff4ce" stroke="#987631"/><text x="545" y="1284" text-anchor="middle" font-family="Arial" font-size="22">×</text><text x="545" y="1323" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Balance settled?</text><rect x="750" y="1365" width="230" height="72" rx="10" fill="#e6f3ed" stroke="#477080"/><text x="759" y="1380" font-size="9" font-family="Arial" fill="#4a626f">USER</text><text x="865" y="1397" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Review customer credit status;</text><text x="865" y="1411" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">decide whether to restore</text><text x="865" y="1425" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">eligibility</text><circle cx="865" cy="1499" r="18" fill="white" stroke="#183e51" stroke-width="4"/><text x="865" y="1535" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Collection recorded and account</text><text x="865" y="1549" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">reviewed</text></svg>