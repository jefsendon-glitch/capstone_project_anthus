="Arial" fill="#4a626f">USER</text><text x="225" y="592" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Correct order, replenish stock</text><text x="225" y="606" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">or choose cash</text><path d="M225,675 l28,28 -28,28 -28,-28 Z" fill="#fff4ce" stroke="#987631"/><text x="225" y="709" text-anchor="middle" font-family="Arial" font-size="22">×</text><text x="225" y="748" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Delivery?</text><rect x="110" y="790" width="230" height="72" rx="10" fill="#e6f3ed" stroke="#477080"/><text x="119" y="805" font-size="9" font-family="Arial" fill="#4a626f">USER</text><text x="225" y="822" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Confirm pending delivery order</text><rect x="110" y="905" width="230" height="72" rx="10" fill="#e6f3ed" stroke="#477080"/><text x="119" y="920" font-size="9" font-family="Arial" fill="#4a626f">USER</text><text x="225" y="937" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Prepare order; mark out for</text><text x="225" y="951" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">delivery</text><rect x="110" y="1020" width="230" height="72" rx="10" fill="#e6f3ed" stroke="#477080"/><text x="119" y="1035" font-size="9" font-family="Arial" fill="#4a626f">USER</text><text x="225" y="1052" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Deliver; recheck stock and</text><text x="225" y="1066" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">credit before completion</text><path d="M225,1135 l28,28 -28,28 -28,-28 Z" fill="#fff4ce" stroke="#987631"/><text x="225" y="1169" text-anchor="middle" font-family="Arial" font-size="22">×</text><text x="225" y="1208" text-anchor="middle" font-size="12" font-family="Arial" fill="#183344">Cash?</text><rect x="110" y="1250" width="230" height="72" rx="10"